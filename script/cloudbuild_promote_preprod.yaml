steps:
  - name: gcr.io/$PROJECT_ID/testrunner
    args:
      - '-c'
      - |
        set -e
        echo Pulling image dev image with tag $SHORT_SHA ...

        source_image=$LOCATION-docker.pkg.dev/$_DEV_PROJECT_ID/$_GAR_DEV_REPO/$_GAR_PACKAGE
        docker pull "$$source_image:$SHORT_SHA"
        source_digest=$(gcloud artifacts docker images describe "$$source_image:$SHORT_SHA" --format='value(image_summary.digest)')

        if [[ ! "$$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "ERROR: source image did not resolve to a valid digest: $$source_digest" >&2
          exit 1
        fi

        echo Tagging pulled image as a release candidate $TAG_NAME ...

        release_image=$LOCATION-docker.pkg.dev/$PROJECT_ID/$_GAR_RELEASES_REPO/$_GAR_PACKAGE
        docker tag "$$source_image@$$source_digest" "$$release_image:$TAG_NAME"

        echo Pushing tagged image to release GAR ...

        docker push "$$release_image:$TAG_NAME"
        release_digest=$(gcloud artifacts docker images describe "$$release_image:$TAG_NAME" --format='value(image_summary.digest)')

        if [[ ! "$$release_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "ERROR: could not resolve release image digest: $$release_digest" >&2
          exit 1
        fi

        if [[ "$$release_digest" != "$$source_digest" ]]; then
          echo "ERROR: source image digest $$source_digest does not match release digest $$release_digest" >&2
          exit 1
        fi

        gcloud run deploy survey-assist-api --image="$$release_image@$$release_digest" --region $LOCATION --project $_PREPROD_PROJECT_ID

        export SURVEY_ASSIST_API_URL="https://survey-assist-api-$_PREPROD_PROJECT_NUMBER.$LOCATION.run.app/$_API_VERSION/survey-assist"
        export SA_ID_TOKEN=$(gcloud auth print-identity-token --impersonate-service-account=$_API_SA)

        echo Running smoke tests against Survey Assist API $$SURVEY_ASSIST_API_URL

        pytest cicd
    id: 'Promote release image, Deploy and Run Smoke Tests'
    entrypoint: bash
timeout: 600s
options:
  logging: CLOUD_LOGGING_ONLY